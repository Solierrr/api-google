      - UNAUTHENTICATED
      - VALIDATION_FAILED
      - MALFORMED_REQUEST
      - DEPENDENCY_UNAVAILABLE
      - INTERNAL_ERROR
  /v1/address/validate:
    post:
      tags:
      - Endereços
      summary: Valida e normaliza um endereço digitado à mão
      description: "Valida um endereço e devolve o veredito, o que falta ou não foi confirmado e a versão normalizada.\n\n\
        Args:\n    request: linhas do endereço, CEP, cidade, UF e país\n    service: service com os clients google injetados\n\
        \nReturns:\n    O veredito (`ok`, `needs_review` ou `invalid`) e o endereço normalizado com coordenadas\n\nRaises:\n\
        \    GoogleValidationException: pedido inválido / HTTP 400"
      operationId: validateAddress
      security:
      - bearerAuth: []
      parameters:
      - name: _capability
        in: query
        required: false
        schema:
          type: string
          default: address_validation
          title: ' Capability'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateResponse'
        '400':
          description: O Google recusou os parâmetros do pedido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Credencial ausente, inválida ou expirada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: Corpo ou parâmetro inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '502':
          description: O Google respondeu em formato inesperado ou recusou a chave do serviço
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: Google ou api-auth indisponível, ou quota do Google excedida
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '504':
          description: O Google não respondeu a tempo
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Erro interno inesperado
          content:
            application/problem+json:
              schema:
