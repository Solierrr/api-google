openapi: 3.1.0
info:
  title: Solaria — api-google
  description: 'Ponto único de acesso às APIs do Google da Solaria: endereços (Places, Geocoding e Address Validation), fuso
    horário, viabilidade solar e tradução. Sem estado: só consulta o Google e devolve o resultado. Pessoas autenticam com
    o JWT do api-auth (bearerAuth); serviços chamam as rotas /internal com a chave de serviço (serviceKey).'
  contact:
    name: Solaria
    url: https://github.com/Solierrr
  license:
    name: CC0-1.0
    url: https://creativecommons.org/publicdomain/zero/1.0/
  version: 0.4.0  # x-release-please-version
servers:
- url: https://google-registry.onrender.com
  description: QA
- url: http://localhost:8000
  description: Local
paths:
  /health:
    get:
      tags:
      - Saúde
      summary: Indica se o processo está vivo
      description: Responde sem consultar nenhuma dependência
      operationId: getHealth
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          description: Erro interno inesperado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      security: []
      x-error-codes:
      - INTERNAL_ERROR
  /ready:
    get:
      tags:
      - Saúde
      summary: Indica se o serviço está pronto para atender
      description: 'O serviço não guarda estado: fica pronto quando os clientes HTTP do Google e do api-auth foram criados.
        Quando não está pronto, responde 503 com {"status": "DOWN"}.'
      operationId: getReady
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '500':
          description: Erro interno inesperado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      security: []
      x-error-codes:
      - INTERNAL_ERROR
  /v1/address/suggestions:
    post:
      tags:
      - Endereços
      summary: Sugere endereços enquanto o usuário digita
      description: "Sugere endereços para o texto digitado, restritos ao país informado (padrão BR).\n\nArgs:\n    request:\
        \ texto, token de sessão (opcional), idioma e país\n    service: service com os clients google injetados\n\nReturns:\n\
        \    As sugestões, da mais relevante para a menos (lista vazia se nada casar)\n\nRaises:\n    GoogleUpstreamException:\
        \ resposta HTTP 200 do Google em formato inesperado"
      operationId: suggestAddresses
      security:
      - bearerAuth: []
      parameters:
      - name: _capability
        in: query
        required: false
        schema:
          type: string
          default: address_validation
          title: ' Capability'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuggestionsRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestionsResponse'
        '401':
          description: Credencial ausente, inválida ou expirada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: Corpo ou parâmetro inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '502':
          description: O Google respondeu em formato inesperado ou recusou a chave do serviço
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: Google ou api-auth indisponível, ou quota do Google excedida
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '504':
          description: O Google não respondeu a tempo
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Erro interno inesperado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      x-error-codes:
      - UNAUTHENTICATED
      - VALIDATION_FAILED
      - MALFORMED_REQUEST
      - DEPENDENCY_UNAVAILABLE
      - INTERNAL_ERROR
  /v1/address/places/{place_id}:
    get:
      tags:
      - Endereços
      summary: Detalha o endereço de um lugar escolhido nas sugestões
      description: "Devolve o endereço estruturado e as coordenadas de um lugar.\n\nArgs:\n    place_id: identificador do\
        \ lugar, vindo das sugestões\n    service: service com os clients google injetados\n    session_token: mesmo token\
        \ de sessão enviado nas sugestões\n    language: idioma da resposta\n\nReturns:\n    O endereço com coordenadas\n\n\
        Raises:\n    GoogleNotFoundException: place_id inexistente ou expirado / HTTP 404"
      operationId: getPlace
      security:
      - bearerAuth: []
      parameters:
      - name: place_id
        in: path
        required: true
        schema:
          type: string
          title: Place Id
      - name: session_token
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Mesmo token de sessão enviado nas sugestões (agrupa a cobrança)
          title: Session Token
        description: Mesmo token de sessão enviado nas sugestões (agrupa a cobrança)
      - name: language
        in: query
        required: false
        schema:
          type: string
          description: Idioma da resposta
          default: pt-BR
          title: Language
        description: Idioma da resposta
      - name: _capability
        in: query
        required: false
        schema:
          type: string
          default: address_validation
          title: ' Capability'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '401':
          description: Credencial ausente, inválida ou expirada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Lugar inexistente ou identificador expirado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: Corpo ou parâmetro inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '502':
          description: O Google respondeu em formato inesperado ou recusou a chave do serviço
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: Google ou api-auth indisponível, ou quota do Google excedida
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '504':
          description: O Google não respondeu a tempo
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Erro interno inesperado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      x-error-codes:
      - UNAUTHENTICATED
      - NOT_FOUND
      - VALIDATION_FAILED
      - DEPENDENCY_UNAVAILABLE
      - INTERNAL_ERROR
  /v1/address/geocode:
    post:
      tags:
      - Endereços
      summary: Converte um endereço em texto em coordenadas
      description: "Converte um endereço em texto livre em coordenadas, restrito ao Brasil.\n\nArgs:\n    request: endereço\
        \ e idioma\n    service: service com os clients google injetados\n\nReturns:\n    Os endereços encontrados, com precisão\
        \ e indicação de casamento parcial (lista vazia se nada casar)\n\nRaises:\n    GoogleRateLimitException: quota excedida\
        \ / HTTP 503\n    GoogleValidationException: pedido inválido / HTTP 400"
      operationId: geocodeAddress
      security:
      - bearerAuth: []
      parameters:
      - name: _capability
        in: query
        required: false
        schema:
          type: string
          default: address_validation
          title: ' Capability'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeocodeRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressListResponse'
        '400':
          description: O Google recusou os parâmetros do pedido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Credencial ausente, inválida ou expirada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: Corpo ou parâmetro inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '502':
          description: O Google respondeu em formato inesperado ou recusou a chave do serviço
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: Google ou api-auth indisponível, ou quota do Google excedida
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '504':
          description: O Google não respondeu a tempo
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Erro interno inesperado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      x-error-codes:
      - UPSTREAM_REQUEST_REJECTED
      - UNAUTHENTICATED
      - VALIDATION_FAILED
      - MALFORMED_REQUEST
      - DEPENDENCY_UNAVAILABLE
      - INTERNAL_ERROR
  /v1/address/reverse-geocode:
    post:
      tags:
      - Endereços
      summary: Converte uma coordenada em endereços
      description: "Converte uma coordenada em endereços, do mais específico para o menos.\n\nArgs:\n    request: coordenada\
        \ e idioma\n    service: service com os clients google injetados\n\nReturns:\n    Os endereços encontrados (lista\
        \ vazia se não houver)\n\nRaises:\n    GoogleRateLimitException: quota excedida / HTTP 503\n    GoogleValidationException:\
        \ pedido inválido / HTTP 400"
      operationId: reverseGeocode
      security:
      - bearerAuth: []
      parameters:
      - name: _capability
        in: query
        required: false
        schema:
          type: string
          default: address_validation
          title: ' Capability'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReverseGeocodeRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressListResponse'
        '400':
          description: O Google recusou os parâmetros do pedido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Credencial ausente, inválida ou expirada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: Corpo ou parâmetro inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '502':
          description: O Google respondeu em formato inesperado ou recusou a chave do serviço
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: Google ou api-auth indisponível, ou quota do Google excedida
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '504':
          description: O Google não respondeu a tempo
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Erro interno inesperado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      x-error-codes:
