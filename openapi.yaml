      - UNAUTHENTICATED
      - VALIDATION_FAILED
      - MALFORMED_REQUEST
      - DEPENDENCY_UNAVAILABLE
      - INTERNAL_ERROR
  /v1/address/resolve:
    post:
      tags:
      - Endereços
      summary: Resolve o endereço final de um lugar escolhido ou de um texto
      description: "Devolve o endereço estruturado, as coordenadas e a validação em uma só chamada.\n\nInforme `place_id`\
        \ (lugar escolhido nas sugestões) ou `query` (texto livre), nunca os dois.\nSe a validação falhar por erro do Google,\
        \ o endereço ainda é devolvido, com `validation` nulo.\n\nArgs:\n    request: `place_id` ou `query`, token de sessão\
        \ e idioma\n    service: service com os clients google injetados\n\nReturns:\n    O endereço com coordenadas e a validação\n\
        \nRaises:\n    GoogleNotFoundException: lugar ou texto sem resultado / HTTP 404"
      operationId: resolveAddress
      security:
      - bearerAuth: []
      parameters:
      - name: _capability
        in: query
        required: false
        schema:
          type: string
          default: address_validation
          title: ' Capability'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveResponse'
        '401':
          description: Credencial ausente, inválida ou expirada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Lugar ou texto sem resultado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: Corpo ou parâmetro inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '502':
          description: O Google respondeu em formato inesperado ou recusou a chave do serviço
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: Google ou api-auth indisponível, ou quota do Google excedida
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '504':
          description: O Google não respondeu a tempo
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Erro interno inesperado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      x-error-codes:
      - UNAUTHENTICATED
      - NOT_FOUND
      - VALIDATION_FAILED
      - MALFORMED_REQUEST
      - DEPENDENCY_UNAVAILABLE
      - INTERNAL_ERROR
  /internal/solar/roof-viability:
    get:
      tags:
      - Energia solar
      summary: Consulta a viabilidade solar do telhado mais próximo
      description: Chamado só pelo ai-geographic, com a chave de serviço dele. Toda chamada consulta a Solar API.
      operationId: getRoofViability
      security:
      - serviceKey: []
      parameters:
      - name: latitude
        in: query
        required: true
        schema:
          type: number
          maximum: 90
          minimum: -90
          description: Latitude do ponto a consultar
          title: Latitude
        description: Latitude do ponto a consultar
      - name: longitude
        in: query
        required: true
        schema:
          type: number
          maximum: 180
          minimum: -180
          description: Longitude do ponto a consultar
          title: Longitude
        description: Longitude do ponto a consultar
      - name: _capability
        in: query
        required: false
        schema:
          type: string
          default: solar
          title: ' Capability'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolarViability'
        '401':
          description: Credencial ausente, inválida ou expirada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Serviço chamador não autorizado nesta rota
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Sem cobertura de dados solares para a coordenada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: Corpo ou parâmetro inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '502':
          description: O Google respondeu em formato inesperado ou recusou a chave do serviço
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: Google ou api-auth indisponível, ou quota do Google excedida
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '504':
          description: O Google não respondeu a tempo
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Erro interno inesperado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      x-error-codes:
      - UNAUTHENTICATED
      - FORBIDDEN
      - NOT_FOUND
      - VALIDATION_FAILED
      - DEPENDENCY_UNAVAILABLE
      - INTERNAL_ERROR
  /v1/geo/timezone:
    get:
      tags:
      - Geografia
      summary: Fuso horário de uma coordenada
      description: "Descobre o fuso horário da coordenada sem consultar nenhuma API externa.\n\nArgs:\n    latitude: latitude\
        \ do ponto\n    longitude: longitude do ponto\n    service: service com a base de fusos local\n    at: instante para\
        \ calcular o deslocamento do UTC\n\nReturns:\n    O identificador IANA do fuso e o deslocamento do UTC em segundos\n\
        \nRaises:\n    HTTPException: 404 se não for possível determinar o fuso"
      operationId: getTimezone
      security:
      - bearerAuth: []
      parameters:
      - name: latitude
        in: query
        required: true
        schema:
          type: number
          maximum: 90
          minimum: -90
          description: Latitude do ponto
          title: Latitude
        description: Latitude do ponto
      - name: longitude
        in: query
        required: true
        schema:
          type: number
          maximum: 180
          minimum: -180
          description: Longitude do ponto
          title: Longitude
        description: Longitude do ponto
      - name: at
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: 'Instante para calcular o deslocamento do UTC (ISO 8601; omitido: agora; sem fuso vale UTC)'
          title: At
        description: 'Instante para calcular o deslocamento do UTC (ISO 8601; omitido: agora; sem fuso vale UTC)'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimezoneResponse'
        '401':
          description: Credencial ausente, inválida ou expirada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Fuso horário indeterminado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: Corpo ou parâmetro inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: api-auth indisponível
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Erro interno inesperado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      x-error-codes:
      - UNAUTHENTICATED
      - NOT_FOUND
      - VALIDATION_FAILED
      - DEPENDENCY_UNAVAILABLE
      - INTERNAL_ERROR
